<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trace Overlay</title>
<style>
:root{--panel:rgba(20,20,24,.78);--text:#fff;--accent:#4f8cff;--btn:rgba(255,255,255,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(20,20,24,.78);--text:#fff}}
:root[data-theme="dark"]{--panel:rgba(20,20,24,.78);--text:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:var(--text);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#ov{position:absolute;left:50%;top:50%;max-width:80vw;max-height:80vh;opacity:.5;user-select:none;-webkit-user-drag:none;pointer-events:none;display:none}
#msg{position:absolute;left:16px;right:16px;top:30%;text-align:center;font-size:15px;line-height:1.4;background:var(--panel);padding:14px;border-radius:14px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:18px 18px 0 0;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center}
button,label.b{flex:1;background:var(--btn);color:var(--text);border:0;border-radius:12px;padding:11px 6px;font-size:14px;text-align:center;cursor:pointer;font-family:inherit}
button.on{background:var(--accent)}
input[type=range]{flex:1;accent-color:var(--accent);height:32px}
#pct{width:42px;text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
#show{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:none;width:auto;padding:10px 14px;background:var(--panel)}
input[type=file]{display:none}
</style>
</head>
<body>
<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <img id="ov" alt="">
  <div id="msg">Tap Photo to choose an image. Allow camera access when asked.</div>
</div>
<button id="show">Controls</button>
<div id="bar">
  <div class="row"><span>Opacity</span><input id="op" type="range" min="0" max="100" value="50"><span id="pct">50%</span></div>
  <div class="row">
    <label class="b" for="file">Photo</label><input id="file" type="file" accept="image/*">
    <button id="lock">Lock</button>
    <button id="flip">Flip cam</button>
    <button id="reset">Reset</button>
    <button id="hide">Hide</button>
  </div>
</div>
<script>
(function(){
  var cam=document.getElementById('cam'), ov=document.getElementById('ov'), msg=document.getElementById('msg');
  var op=document.getElementById('op'), pct=document.getElementById('pct'), stage=document.getElementById('stage');
  var bar=document.getElementById('bar'), show=document.getElementById('show');
  var facing='environment', stream=null, locked=false;
  var st={x:0,y:0,s:1,r:0};

  function apply(){
    ov.style.transform='translate(-50%,-50%) translate('+st.x+'px,'+st.y+'px) rotate('+st.r+'rad) scale('+st.s+')';
  }
  function setOp(){ ov.style.opacity=op.value/100; pct.textContent=op.value+'%'; }
  op.addEventListener('input',setOp);

  async function startCam(){
    try{
      if(stream) stream.getTracks().forEach(function(t){t.stop();});
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false});
      cam.srcObject=stream;
      if(!ov.src) msg.style.display='block'; 
    }catch(e){
      msg.style.display='block';
      msg.textContent='Camera unavailable. Allow camera access, or open this page directly in your phone’s browser (Safari or Chrome) rather than inside another app.';
    }
  }
  async function keepAwake(){ try{ if(navigator.wakeLock) await navigator.wakeLock.request('screen'); }catch(e){} }
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) keepAwake(); });

  document.getElementById('file').addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0]; if(!f) return;
    var url=URL.createObjectURL(f);
    ov.onload=function(){ ov.style.display='block'; msg.style.display='none'; st={x:0,y:0,s:1,r:0}; apply(); setOp(); };
    ov.src=url;
  });

  var lockBtn=document.getElementById('lock');
  lockBtn.addEventListener('click',function(){ locked=!locked; lockBtn.classList.toggle('on',locked); lockBtn.textContent=locked?'Locked':'Lock'; });
  document.getElementById('flip').addEventListener('click',function(){ facing=facing==='environment'?'user':'environment'; startCam(); });
  document.getElementById('reset').addEventListener('click',function(){ st={x:0,y:0,s:1,r:0}; apply(); });
  document.getElementById('hide').addEventListener('click',function(){ bar.style.display='none'; show.style.display='block'; });
  show.addEventListener('click',function(){ bar.style.display='flex'; show.style.display='none'; });

  // gestures: one finger drags, two fingers pinch to scale and twist to rotate
  var ptrs=new Map(), last=null;
  function info(){
    var p=Array.from(ptrs.values());
    if(p.length===1) return {n:1,cx:p[0].x,cy:p[0].y};
    var dx=p[1].x-p[0].x, dy=p[1].y-p[0].y;
    return {n:2,cx:(p[0].x+p[1].x)/2,cy:(p[0].y+p[1].y)/2,d:Math.hypot(dx,dy),a:Math.atan2(dy,dx)};
  }
  stage.addEventListener('pointerdown',function(e){
    if(locked) return;
    stage.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    last=info();
  });
  stage.addEventListener('pointermove',function(e){
    if(locked||!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    var cur=info();
    if(last&&cur.n===last.n){
      st.x+=cur.cx-last.cx; st.y+=cur.cy-last.cy;
      if(cur.n===2){
        if(last.d>0) st.s=Math.max(.05,Math.min(20,st.s*cur.d/last.d));
        st.r+=cur.a-last.a;
      }
      apply();
    }
    last=cur;
  });
  function up(e){ ptrs.delete(e.pointerId); last=ptrs.size?info():null; }
  stage.addEventListener('pointerup',up);
  stage.addEventListener('pointercancel',up);

  setOp(); apply(); startCam(); keepAwake();
})();
</script>
</body>
</html>
